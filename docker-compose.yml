# Local development stack.
#
# ADR-7: this stack never contains real patient data. It is seeded from
# test-data/ (synthetic DICOM) and nothing else. Do not point it at a
# production snapshot, not even briefly.
#
# Two ways to run it:
#
#   docker compose up -d postgres redis        dependencies only; apps run on
#                                              the host (pnpm dev). The default.
#   docker compose --profile apps up -d        dependencies AND the API and web
#                                              in containers.
#
# The app services sit behind the `apps` profile so the first form keeps
# behaving exactly as it always has, and so containers do not fight the host's
# `next dev` for ports 3000 and 3001.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mir-postgres
    # Headroom for parallel test workers, each of which uses its own database
    # and its own pools. The default of 100 is exhausted by a full run on a
    # many-core machine.
    command: ['postgres', '-c', 'max_connections=300']
    environment:
      # Local development credentials. Deployed environments take these from
      # AWS Secrets Manager (BUILD_SPEC §6) and never from a compose file.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mir
    ports:
      # Host 5433, not 5432. A native PostgreSQL install is common on developer
      # machines and would otherwise collide; overriding the host port is
      # cheaper than asking everyone to stop their local server.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - mir-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mir']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: mir-redis
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  orthanc:
    image: orthancteam/orthanc:24.10.1
    container_name: mir-orthanc
    # LOCAL DEVELOPMENT ONLY. In deployed environments Orthanc runs in a
    # PRIVATE subnet with no internet route, reachable only from the API
    # (BUILD_SPEC P8.1). The port mapping below exists so a developer can
    # inspect it; it is exactly what must NOT exist in staging or production.
    environment:
      ORTHANC__NAME: MIR-dev
      ORTHANC__REGISTERED_USERS: '{"mir-api":"change-me"}'
      ORTHANC__DICOM_SERVER_ENABLED: 'false'
      ORTHANC__AUTHENTICATION_ENABLED: 'true'
      ORTHANC__DICOM_WEB__ENABLE: 'true'
      ORTHANC__OVERWRITE_INSTANCES: 'false'
      # ADR-5: never transcode. Expressed by OMITTING IngestTranscoding —
      # setting it to an empty string makes Orthanc refuse to start.
    volumes:
      - ./infra/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - mir-orthanc-db:/var/lib/orthanc/db
    ports:
      - '${ORTHANC_HOST_PORT:-8042}:8042'
    healthcheck:
      # The image ships neither curl nor wget, and CMD-SHELL runs dash (so
      # bash's /dev/tcp is unavailable too). python3 IS present.
      #
      # The probe asserts an UNAUTHENTICATED request is refused with 401. That
      # checks two things at once: the server is up, and authentication is
      # still switched on. If someone disables auth, the container goes red
      # instead of quietly serving patient imaging to anyone who can reach the
      # port. It also needs no credentials in this file.
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.error, urllib.request
          try:
              urllib.request.urlopen('http://127.0.0.1:8042/system', timeout=3)
          except urllib.error.HTTPError as e:
              sys.exit(0 if e.code == 401 else 1)
          except Exception:
              sys.exit(1)
          sys.exit(1)  # 200 without credentials means auth is OFF
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: mir-keycloak
    # Local development only. In deployed environments Keycloak runs in a
    # PRIVATE subnet with its own database, TLS enforced, and the admin console
    # unreachable from the internet (BUILD_SPEC P4.1).
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
      # Pin the issuer to the browser-visible address. Without this, a token
      # requested over the compose network (web -> keycloak:8080, for the
      # email+password form) would carry iss=http://keycloak:8080/… and the
      # API would reject it — its KEYCLOAK_ISSUER_URL below says localhost.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8080}
    volumes:
      - ./infra/keycloak/realm-mir.json:/opt/keycloak/data/import/realm-mir.json:ro
      # KEEP THE REALM ACROSS RECREATES.
      #
      # Without this, every `docker compose up` that touches this service starts
      # a fresh Keycloak: no users, no `mir-api-admin` client, and the realm back
      # to `sslRequired: all` — which 403s every HTTP token request. Login and
      # sign-up both break, and neither failure says why. That happened three
      # times in one afternoon before this volume existed.
      #
      # Mounted at /opt/keycloak/data, not at its `h2` subdirectory. That
      # subdirectory does not exist in the image, so Docker would create it
      # root-owned and Keycloak — which runs as a non-root user — cannot write
      # it: the container dies on `AccessDeniedException ... keycloakdb.mv.db`.
      # The parent DOES exist in the image, so the volume inherits its
      # ownership. The realm-import bind above is more specific and is layered
      # on top, so it still applies.
      #
      # THE TRADE: `--import-realm` only imports when the realm is absent, so
      # edits to realm-mir.json no longer take effect on restart. To pick them
      # up, drop the volume: `docker compose down && docker volume rm
      # mir_mir-keycloak-data`. `scripts/dev-bootstrap.mjs` is idempotent and
      # re-applies the dev settings either way.
      - mir-keycloak-data:/opt/keycloak/data
    ports:
      - '${KEYCLOAK_HOST_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy

  # OpenTelemetry collector — PHASE 13.
  #
  # Behind the `apps` profile so `docker compose up -d postgres redis` is
  # unaffected. Spans are scrubbed by the Tracer BEFORE they reach any
  # exporter, so what arrives here is what would arrive at a managed backend.
  otel-collector:
    profiles: ['apps']
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: mir-otel-collector
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - '${OTEL_HTTP_PORT:-4318}:4318'

  # --- application containers (profile: apps) -------------------------------

  migrate:
    profiles: ['apps']
    image: mir-api:local
    build:
      # Root context, not apps/api: the pnpm lockfile and packages/* live here.
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mir-migrate
    restart: 'no'
    # DATABASE_MIGRATOR_URL, not DATABASE_URL. The migrator must connect as a
    # role that OWNS the tables; mir_app deliberately cannot run DDL, so that an
    # injection bug cannot drop an RLS policy (ADR-6, migrate-cli.ts).
    #
    # Taken from .env rather than written inline: a connection string in a
    # committed compose file is a committed secret (§6). `:?` fails the run
    # loudly instead of silently falling back to a local database that has no
    # migrations on it.
    environment:
      DATABASE_MIGRATOR_URL: ${DATABASE_MIGRATOR_URL:?set DATABASE_MIGRATOR_URL in .env}
    command: ['node', 'dist/shared/db/migrate-cli.js', 'up']
    # migrate-cli makes ONE connection attempt and exits 1 on failure, so the
    # waiting has to happen out here. Without this, compose starts the migrator
    # alongside postgres and the connect is refused seconds before postgres has
    # even opened its socket. `service_started` would not be enough either: a
    # restarted server replays WAL for several seconds before it accepts
    # connections, which is what the healthcheck below actually waits for.
    depends_on:
      postgres:
        condition: service_healthy

  db-grant:
    profiles: ['apps']
    # postgres image for psql; the API image ships no database client.
    image: postgres:16-alpine
    container_name: mir-db-grant
    restart: 'no'
    # Migration 0002 creates mir_app as NOLOGIN with no password on purpose — a
    # password in a migration is a password in git. So the role cannot connect
    # until something attaches a local one, which is what this does.
    #
    # The alternative is pointing the API at the postgres superuser, and that
    # would quietly disable the second layer of access control: superusers
    # bypass RLS, so every ADR-6 policy would stop applying locally while the
    # app appeared to work. This mirrors what the RLS test harness already does
    # (apps/api/src/shared/db/testing/rls-harness.ts).
    environment:
      # The migrator URL owns the tables, so it is also the only thing here
      # permitted to ALTER a role. Session mode (5432) — see .env.
      MIGRATOR_URL: ${DATABASE_MIGRATOR_URL:?set DATABASE_MIGRATOR_URL in .env}
      APP_PASSWORD: ${MIR_APP_DEV_PASSWORD:?set MIR_APP_DEV_PASSWORD in .env}
    entrypoint:
      - sh
      - -c
      - |
        psql -v ON_ERROR_STOP=1 "$$MIGRATOR_URL" \
          -c "ALTER ROLE mir_app LOGIN PASSWORD '$$APP_PASSWORD'"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    profiles: ['apps']
    image: mir-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mir-api
    environment:
      # development, NOT production. StorageModule refuses to boot in staging or
      # production without a real S3-backed store (config.schema.ts), and it is
      # right to: originals on a container filesystem are one restart from being
      # lost. This stack holds synthetic data only (ADR-7).
      NODE_ENV: development
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-debug}

      # The non-superuser application role, so RLS is genuinely enforced here
      # rather than silently bypassed (ADR-6, P3.2). Password attached by
      # db-grant above.
      #
      # COMPOSED HERE, from the same variable db-grant uses, rather than taken
      # whole from .env. Nothing secret is added by doing so — the only secret
      # is the password, and that is still a reference — but it removes the one
      # thing a whole connection string in .env cannot prevent: db-grant
      # attaching one password to mir_app while this hands the API a different
      # one. That drift is not hypothetical, it is what made every request fail
      # with "password authentication failed for user mir_app" on 2026-09-01,
      # and nothing in the error points at two variables disagreeing.
      DATABASE_URL: postgresql://mir_app:${MIR_APP_DEV_PASSWORD:?set MIR_APP_DEV_PASSWORD in .env}@postgres:5432/mir
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}

      REDIS_URL: redis://redis:6379
      # P13 — the otel-collector service below has always existed; until
      # now nothing pointed the API at it and the app emitted no spans.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

      # These two URLs differ ON PURPOSE, and the config schema keeps them
      # separate precisely so they can.
      #
      # ISSUER is the `iss` claim the browser's token will carry, so it must be
      # the address the BROWSER used — a published host port. JWKS is fetched by
      # the API over the compose network, where `localhost` is the API container
      # itself. Setting both to one value breaks either signature verification
      # or issuer validation, depending on which one you pick.
      KEYCLOAK_ISSUER_URL: http://localhost:${KEYCLOAK_HOST_PORT:-8080}/realms/mir
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/mir/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-mir-api}

      # Self-service sign-up (§5.1). Optional on purpose: with no admin
      # credential /auth/register answers 501 instead of inventing a local
      # account, so a deployment that provisions users out of band simply
      # leaves these unset.
      #
      # Declared with NO VALUE, which passes the variable through only when it
      # is defined. `${VAR:-}` would set it to the empty string, and the config
      # schema's `.min(1)` rejects that — the API would refuse to boot with a
      # complaint about a variable nobody set.
      KEYCLOAK_ADMIN_CLIENT_ID:
      KEYCLOAK_ADMIN_CLIENT_SECRET:
      # Where to REACH the admin API, which is not where the issuer says
      # tokens come from: KEYCLOAK_ISSUER_URL must stay `localhost` so it
      # matches the `iss` a browser-obtained token carries, and `localhost`
      # in here is this container. Same split as KEYCLOAK_JWKS_URL above.
      KEYCLOAK_ADMIN_URL: http://keycloak:8080

      # Matches ORTHANC__REGISTERED_USERS on the orthanc service above. The
      # browser never talks to Orthanc directly (P8.2) — only the API does.
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-mir-api}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-change-me}

      AWS_REGION: ${AWS_REGION:-eu-south-1}
      S3_BUCKET_ORIGINALS: ${S3_BUCKET_ORIGINALS:-mir-dev-dicom-originals}
      S3_BUCKET_DERIVED: ${S3_BUCKET_DERIVED:-mir-dev-derived}
      S3_BUCKET_AUDIT_LOGS: ${S3_BUCKET_AUDIT_LOGS:-mir-dev-audit-logs}

      # Development BlobStore root. Owned by the `node` user in the image so the
      # named volume below inherits writable ownership.
      LOCAL_STORAGE_ROOT: /var/lib/mir/storage

      # Local-only value. Deployed environments take this from Secrets Manager
      # (§6); rotating it invalidates in-flight image URLs only.
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:-change-me-local-dev-only-at-least-32-chars}
    volumes:
      - mir-api-storage:/var/lib/mir/storage
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    depends_on:
      redis:
        condition: service_healthy
      orthanc:
        condition: service_healthy
      # Not service_healthy: the keycloak service declares no healthcheck. The
      # API resolves JWKS lazily on first token verification, not at boot, so it
      # tolerates Keycloak still starting.
      keycloak:
        condition: service_started
      db-grant:
        condition: service_completed_successfully

  web:
    profiles: ['apps']
    image: mir-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Makes the container stack single-origin: Next rewrites /api/* to the
        # API service, the way Cloudflare does at the edge in deployed
        # environments (P8.2/P14.3). A build argument rather than an environment
        # variable because `next build` bakes the resolved rewrite into the
        # standalone output — see the rewrites() block in next.config.mjs.
        API_ORIGIN: http://api:3000
    container_name: mir-web
    environment:
      # Read at RUNTIME by app/auth/password-login/route.ts (unlike API_ORIGIN,
      # nothing here is baked at build). ISSUER is what the minted token's iss
      # must be; TOKEN_URL is where this container can actually reach Keycloak.
      # The two differ for the same split-horizon reason as the API's pair.
      KEYCLOAK_ISSUER_URL: http://localhost:${KEYCLOAK_HOST_PORT:-8080}/realms/mir
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/mir/protocol/openid-connect/token
    ports:
      - '${WEB_HOST_PORT:-3001}:3001'
    depends_on:
      api:
        condition: service_healthy

volumes:
  mir-pgdata:
  mir-keycloak-data:
  mir-orthanc-db:
  mir-api-storage:
