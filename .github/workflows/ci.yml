name: CI

# BUILD_SPEC P1.3 — runs on every PR, fails the PR on any non-zero exit.
#
# The guardrail jobs (boundaries, authz, secrets, synthetic-data) are not
# optional extras. They are the mechanism by which ADR-1's module boundaries
# and ADR-7's no-real-data rule stay true. A PR that turns any of them off is
# a PR that removes a safety property, and should be reviewed as such.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # BUILD_SPEC §4 pinned Node 20 LTS, which went end-of-life on 2026-04-30.
  # 22 is what apps/api and apps/web's Dockerfiles already ship, and CI must
  # test the runtime production runs — it is the authority on that version;
  # a developer's local Node may be newer. (dependency-cruiser 18 also
  # refuses to start on 20.)
  NODE_VERSION: '22'

jobs:
  # --------------------------------------------------------------------------
  # Fast, dependency-free checks. These run first so an obvious mistake fails
  # in seconds rather than after a five-minute install.
  # --------------------------------------------------------------------------
  guardrails:
    name: Guardrails (secrets, synthetic data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan commits, not just the working tree.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ADR-7: real patient data never leaves production. Fails if any
      # PatientName under test-data/ is not on the synthetic allowlist.
      - name: Synthetic test data only
        run: node test-data/check-synthetic.mjs

      # BUILD_SPEC P1.6 / §6: no secrets in code or CI logs.
      - name: Secret scan (working tree)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # install -> typecheck -> lint -> test -> build (P1.3, in order)
  # --------------------------------------------------------------------------
  build:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    # The P3.2 row-level-security tests are the most important gate in the
    # project and the spec requires them to run on every commit. They need a
    # real PostgreSQL: RLS policies, role attributes and the gist exclusion
    # constraint cannot be exercised against a mock or an in-memory shim.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mir
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: '5433'
      TEST_PG_SUPERUSER: postgres
      TEST_PG_SUPERPASS: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # @mir/contracts and @mir/dicom-utils publish their types from dist/,
      # which is gitignored. Without this every import of them is TS2307 in a
      # clean checkout — green locally only because a stale dist/ is lying
      # around from an earlier build.
      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Includes the P3.2 RLS suite. If PostgreSQL is unreachable these tests
      # fail rather than skip — a silently skipped access-control test is
      # indistinguishable from a passing one in a green build.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # --------------------------------------------------------------------------
  # P14.2 — dependency and container scanning. Fails the build on high/critical.
  # --------------------------------------------------------------------------
  vulnerabilities:
    name: Dependency scan (P14.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A known-vulnerable dependency must block the build, not warn.
      # `pnpm audit` exits non-zero when findings at or above the level exist.
      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high

      # Filesystem scan catches transitive issues the registry audit misses,
      # and covers non-npm files (lockfiles, Dockerfiles).
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # Both steps above passing proves the tree is clean. It does NOT prove
      # they would catch anything: a raised threshold or a scanner pointed at
      # the wrong path stays green forever while enforcing nothing. This plants
      # a known-vulnerable package and fails if the scan does not go red.
      - name: Verify the dependency scan still blocks a vulnerable package
        run: pnpm scan:verify

  # --------------------------------------------------------------------------
  # P1.4 — module boundaries. Separate job so a boundary violation is
  # immediately legible in the checks list rather than buried in a lint log.
  # --------------------------------------------------------------------------
  boundaries:
    name: Module boundaries (P1.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Enforce module boundaries
        run: pnpm boundaries

      # Proves the boundary rules still reject violations. Without this, a
      # config edit that quietly narrows a rule leaves the check passing
      # forever while enforcing nothing.
      - name: Verify boundary enforcement still works
        run: pnpm boundaries:verify

  # --------------------------------------------------------------------------
  # P1.2 — browser end-to-end tests.
  # --------------------------------------------------------------------------
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Built before the Playwright job so a slow build cannot surface as a
      # webServer timeout. @mir/api too: e2e/viewer.spec.ts renders its
      # fixtures with the API's real ThumbnailService from apps/api/dist.
      - name: Build web app
        run: pnpm --filter @mir/web... --filter @mir/api... build

      # P8.2: no path from the browser to Orthanc that bypasses the API.
      # Runs against the built bundle, so it must follow the build step.
      - name: No server secrets in the client bundle (P8.2)
        run: pnpm check:bundle

      - name: Install Playwright browsers
        run: pnpm --filter @mir/web exec playwright install --with-deps chromium chromium-headless-shell

      - name: Run e2e
        run: pnpm --filter @mir/web test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Terraform static checks.
  #
  # This closes NO gate. Every P2 gate stays blocked — there is no AWS account,
  # and `terraform plan` needs credentials and a state backend. What this does
  # is stop ~2,700 lines of infrastructure nobody can apply from rotting
  # silently before the account exists: a syntax error or a dropped argument
  # would otherwise be discovered under launch pressure.
  # --------------------------------------------------------------------------
  terraform:
    name: Terraform static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          # Matches required_version "~> 1.9" in the environment stacks.
          terraform_version: 1.9.8

      - name: Format
        run: terraform fmt -check -recursive infra/terraform

      # -backend=false: init would otherwise try to reach the S3 state bucket,
      # which does not exist and needs credentials. validate does not need it.
      - name: Validate modules and environments
        run: |
          set -euo pipefail
          for dir in infra/terraform/modules/*/ infra/terraform/environments/*/; do
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
          soft_fail: false
